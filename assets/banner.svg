<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">NEON — Independent Developer</title>
  <desc id="desc">Dark technical banner with pink and acid-green accents for systems programming, local AI and open source.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15151A"/><stop offset=".55" stop-color="#1C1C24"/><stop offset="1" stop-color="#111820"/></linearGradient>
    <radialGradient id="pinkGlow"><stop stop-color="#FF66C4" stop-opacity=".22"/><stop offset="1" stop-color="#FF66C4" stop-opacity="0"/></radialGradient>
    <radialGradient id="greenGlow"><stop stop-color="#A3E635" stop-opacity=".16"/><stop offset="1" stop-color="#A3E635" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FF66C4"/><stop offset=".52" stop-color="#D88BD2"/><stop offset="1" stop-color="#A3E635"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#DDE2EA" stroke-opacity=".055" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <ellipse cx="190" cy="100" rx="340" ry="260" fill="url(#pinkGlow)"/>
  <ellipse cx="1050" cy="220" rx="300" ry="230" fill="url(#greenGlow)"/>
  <g fill="none" stroke-width="1.5" opacity=".42">
    <path d="M790 0V42H900V82H1000V122H1200" stroke="#A3E635"/>
    <path d="M850 300V250H930V210H1030V170H1200" stroke="#FF66C4"/>
    <path d="M1020 0V34H1090V68H1160" stroke="#FF66C4"/>
    <path d="M760 300V266H820V232H900" stroke="#A3E635"/>
  </g>
  <g fill="#A3E635" opacity=".8"><circle cx="900" cy="82" r="3"/><circle cx="1030" cy="170" r="3"/><circle cx="1090" cy="68" r="3"/></g>
  <g fill="#FF66C4" opacity=".8"><circle cx="850" cy="250" r="3"/><circle cx="1000" cy="122" r="3"/><circle cx="820" cy="232" r="3"/></g>
  <path d="M64 62H112" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <text x="64" y="158" fill="#F4F4F5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="88" font-weight="800" letter-spacing="8">NEON</text>
  <text x="68" y="202" fill="#D1D5DB" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="500" letter-spacing="3">INDEPENDENT DEVELOPER</text>
  <text x="68" y="244" fill="#A1A1AA" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" letter-spacing="2.2">SYSTEMS  /  LOCAL AI  /  OPEN SOURCE</text>
  <text x="1136" y="264" text-anchor="end" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.5">BUILD // EXPLORE // UNDERSTAND</text>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="#FFFFFF" stroke-opacity=".10"/>
  <rect x="64" y="278" width="1072" height="2" rx="1" fill="url(#accent)" opacity=".9"/>
</svg>
